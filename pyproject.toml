# OWNERSHIP: tooling
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-scraper"
version = "0.1.0"
description = "PCPM/TPD study corpus builder from public bi.go.id sources (personal use only)"
requires-python = ">=3.10"
license = { text = "Proprietary - personal use" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.12",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bi-scraper = "bi_scraper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
